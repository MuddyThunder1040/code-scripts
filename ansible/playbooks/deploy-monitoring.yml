---
- name: Deploy monitoring stack on Dell
  hosts: dell
  become: false

  vars:
    monitoring_dir: /data/services/monitoring

  tasks:
    - name: Copy monitoring compose files to Dell
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop:
        - src: "{{ playbook_dir }}/../../dell/services/monitoring/compose.yml"
          dest: "{{ monitoring_dir }}/compose.yml"
        - src: "{{ playbook_dir }}/../../dell/services/monitoring/prometheus.yml"
          dest: "{{ monitoring_dir }}/prometheus.yml"

    - name: Run docker compose up for monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        state: present
        pull: always

    - name: Wait for Prometheus to be healthy
      ansible.builtin.uri:
        url: http://localhost:9090/-/healthy
        status_code: 200
      register: prometheus_health
      until: prometheus_health.status == 200
      retries: 15
      delay: 10

    - name: Wait for Grafana to be accessible
      ansible.builtin.uri:
        url: http://localhost:3000/api/health
        status_code: 200
      register: grafana_health
      until: grafana_health.status == 200
      retries: 15
      delay: 10

    - name: Report monitoring stack status
      ansible.builtin.debug:
        msg: "Monitoring stack is healthy: Prometheus={{ prometheus_health.status }}, Grafana={{ grafana_health.status }}"
