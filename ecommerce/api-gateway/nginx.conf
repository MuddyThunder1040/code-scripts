user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zone: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upstream blocks
    # health check: services expose /health endpoint
    upstream user_service {
        server user-service:8001;
        keepalive 16;
    }

    upstream product_service {
        server product-service:8002;
        keepalive 16;
    }

    upstream order_service {
        server order-service:8003;
        keepalive 16;
    }

    upstream cart_service {
        server cart-service:8004;
        keepalive 16;
    }

    upstream frontend_service {
        server frontend:80;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        # Proxy timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Common proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # API Gateway health check (returns JSON directly)
        location = /api/health {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        # User Service
        location /api/users/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://user_service/users/;
        }

        # Product Service
        location /api/products/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://product_service/products/;
        }

        # Order Service
        location /api/orders/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://order_service/orders/;
        }

        # Cart Service
        location /api/cart/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://cart_service/cart/;
        }

        # Frontend (catch-all)
        location / {
            proxy_pass http://frontend_service/;
        }
    }
}
