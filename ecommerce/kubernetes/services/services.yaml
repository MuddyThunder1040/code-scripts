apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ecommerce-blue
  labels:
    app: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
