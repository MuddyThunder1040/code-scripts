# IMPORTANT: In production, do NOT store secrets in plain YAML committed to git.
# Use a proper secret management solution such as:
#   - HashiCorp Vault (with vault-agent or vault-secrets-operator)
#   - Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets)
#   - AWS Secrets Manager / GCP Secret Manager / Azure Key Vault
#   - Kubernetes External Secrets Operator
# The values below are base64-encoded (NOT encrypted). Anyone with cluster access can read them.
# base64 encoding: echo -n 'value' | base64

apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce-blue
  labels:
    app: ecommerce
type: Opaque
data:
  # postgres  (base64)
  DB_PASSWORD: cG9zdGdyZXM=
  # ""        (base64 of empty string)
  REDIS_PASSWORD: ""
  # supersecretkey123  (base64)
  JWT_SECRET: c3VwZXJzZWNyZXRrZXkxMjM=
