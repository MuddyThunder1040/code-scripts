apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecommerce-blue
  labels:
    app: user-service
    color: blue
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
      color: blue
  template:
    metadata:
      labels:
        app: user-service
        color: blue
        version: "1.0.0"
    spec:
      containers:
        - name: user-service
          image: your-registry/user-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: USER_SERVICE_VERSION
              value: "blue"
          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_SECRET
            - name: USER_SERVICE_VERSION
              value: "blue"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
