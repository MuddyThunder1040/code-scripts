apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce-blue
  labels:
    app: order-service
    color: blue
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
      color: blue
  template:
    metadata:
      labels:
        app: order-service
        color: blue
        version: "1.0.0"
    spec:
      containers:
        - name: order-service
          image: your-registry/order-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DB_PASSWORD
            - name: ORDER_SERVICE_VERSION
              value: "blue"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
