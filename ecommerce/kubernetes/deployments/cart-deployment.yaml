apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: ecommerce-blue
  labels:
    app: cart-service
    color: blue
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-service
      color: blue
  template:
    metadata:
      labels:
        app: cart-service
        color: blue
        version: "1.0.0"
    spec:
      containers:
        - name: cart-service
          image: your-registry/cart-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            - name: CART_SERVICE_VERSION
              value: "blue"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
