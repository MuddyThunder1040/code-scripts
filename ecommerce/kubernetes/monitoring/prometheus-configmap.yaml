apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ecommerce-monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'ecommerce-k8s'
        environment: 'production'

    rule_files:
      # - "alert_rules.yml"

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Kubernetes pods with prometheus.io/scrape=true annotation
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # Kubernetes services
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_service_name

      # User Service metrics (uses prometheus-fastapi-instrumentator)
      - job_name: 'user-service'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets: ['user-service.ecommerce-blue.svc.cluster.local:8001']
        relabel_configs:
          - source_labels: []
            target_label: service
            replacement: user-service

      # Product Service metrics
      - job_name: 'product-service'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets: ['product-service.ecommerce-blue.svc.cluster.local:8002']
        relabel_configs:
          - source_labels: []
            target_label: service
            replacement: product-service

      # Order Service metrics
      - job_name: 'order-service'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets: ['order-service.ecommerce-blue.svc.cluster.local:8003']
        relabel_configs:
          - source_labels: []
            target_label: service
            replacement: order-service

      # Cart Service metrics
      - job_name: 'cart-service'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets: ['cart-service.ecommerce-blue.svc.cluster.local:8004']
        relabel_configs:
          - source_labels: []
            target_label: service
            replacement: cart-service

      # Node Exporter (DaemonSet on each node)
      - job_name: 'node-exporter'
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+):(\d+)
            replacement: $1:9100
            target_label: __address__

      # cAdvisor (container metrics from kubelet)
      - job_name: 'cadvisor'
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+):(\d+)
            replacement: $1:10250
            target_label: __address__
          - source_labels: []
            target_label: __metrics_path__
            replacement: /metrics/cadvisor
