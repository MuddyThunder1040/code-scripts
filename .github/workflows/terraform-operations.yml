name: Terraform Operations

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Terraform module directory'
        required: true
        type: choice
        options: [Cassandra, Local, Docker, Localstack]
      branch:
        description: 'Git branch to use' 
        required: true
        default: main
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options: [plan, apply, show, destroy, validate, init]

jobs:
  terraform:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          clean: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Terraform Login
        run: |
          mkdir -p ~/.terraform.d
          echo '{"credentials":{"app.terraform.io":{"token":"'"$TF_API_TOKEN"'"}}}' > ~/.terraform.d/credentials.tfrc.json
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform init
        working-directory: ${{ inputs.module }}
        run: terraform init

      - name: Clean up Cassandra Docker conflicts
        if: inputs.action == 'apply' && inputs.module == 'Cassandra'
        run: |
          docker ps -a --filter "name=cassandra" --quiet | xargs -r docker rm -f
          docker ps -a --filter "name=opscenter" --quiet | xargs -r docker rm -f
          docker network ls --filter "name=^cassandra-network$" --quiet | xargs -r docker network rm
          docker volume ls --filter "name=^cassandra-data-" --quiet | xargs -r docker volume rm
          docker volume ls --filter "name=^opscenter-data$" --quiet | xargs -r docker volume rm
          echo "Cleaned up conflicting Cassandra/OpsCenter containers, network, and volumes"

      - name: Clean up Docker resources (if needed)
        if: inputs.action == 'apply' && inputs.module == 'Docker'
        run: |
          docker ps -a --filter "name=cassandra" --quiet | xargs -r docker rm -f
          docker network ls --filter "name=cassandra-network" --quiet | xargs -r docker network rm
          echo "Cleaned up conflicting Cassandra containers and networks"

      - name: Terraform ${{ inputs.action }}
        working-directory: ${{ inputs.module }}
        run: |
          if [ "${{ inputs.action }}" = "apply" ]; then
            terraform apply -auto-approve
          elif [ "${{ inputs.action }}" = "destroy" ]; then
            terraform destroy -auto-approve
          else
            terraform ${{ inputs.action }}
          fi

      - name: Verify Cassandra cluster
        if: inputs.action == 'apply' && inputs.module == 'Cassandra'
        working-directory: ${{ inputs.module }}
        run: |
          set -o pipefail

          node_count=$(terraform output -no-color node_container_names | grep -c '"cassandra-node-' || true)
          expected_nodes=$((1 + node_count))

          for attempt in $(seq 1 20); do
            echo "Checking Cassandra cluster status, attempt ${attempt}/20..."

            if docker exec cassandra-seed nodetool -h cassandra-seed -p 7199 status | tee /tmp/cassandra-nodetool-status.txt; then
              up_nodes=$(awk '/^UN/ { count++ } END { print count + 0 }' /tmp/cassandra-nodetool-status.txt)

              if [ "$up_nodes" -eq "$expected_nodes" ]; then
                echo "Cassandra cluster is ready with ${up_nodes}/${expected_nodes} nodes up."
                exit 0
              fi

              echo "Cassandra has ${up_nodes}/${expected_nodes} nodes up; waiting for the rest."
            else
              seed_state=$(docker inspect -f '{{.State.Status}}' cassandra-seed 2>/dev/null || true)
              echo "cassandra-seed state: ${seed_state:-unknown}"

              if [ "$seed_state" = "restarting" ] || [ "$seed_state" = "exited" ]; then
                echo "cassandra-seed is not staying up. Last 200 log lines:"
                docker logs --tail=200 cassandra-seed || true
                exit 1
              fi
            fi

            sleep 30
          done

          echo "Cassandra cluster did not become ready in time."
          echo "Container status:"
          docker ps -a --filter "name=cassandra" || true
          docker ps -a --filter "name=opscenter" || true
          echo "cassandra-seed logs:"
          docker logs --tail=200 cassandra-seed || true
          exit 1

      - name: Notify Slack (success)
        if: success() && (inputs.action == 'apply' || inputs.action == 'destroy')
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{
              "attachments": [{
                "color": "good",
                "text": "Terraform ${{ inputs.action }} completed successfully for ${{ inputs.module }} module on ${{ inputs.branch }} branch."
              }]
            }' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Notify Slack (failure)
        if: failure() && (inputs.action == 'apply' || inputs.action == 'destroy')
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{
              "attachments": [{
                "color": "danger",
                "text": "Terraform ${{ inputs.action }} failed for ${{ inputs.module }} module on ${{ inputs.branch }} branch."
              }]
            }' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Cleanup workspace
        if: always()
        run: |
          cd "${{ github.workspace }}"
          # Clean untracked files but preserve Terraform state and cache
          git clean -fdx --exclude="**/terraform.tfstate" --exclude="**/.terraform/" --exclude="**/.terraform.lock.hcl"
