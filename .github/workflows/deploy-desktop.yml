name: Deploy Desktop Services

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose files to Desktop WSL2 and bring up services
        env:
          DESKTOP_IP: 100.64.213.62
          DESKTOP_USER: vishnu
        run: |
          eval "$(ssh-agent -s)"
          echo "${{ secrets.DESKTOP_SSH_KEY }}" | ssh-add -

          SSH="ssh -o StrictHostKeyChecking=no ${DESKTOP_USER}@${DESKTOP_IP}"
          SCP="scp -o StrictHostKeyChecking=no"

          for service in cassandra databases kafka ai storage; do
            src="desktop/services/${service}/compose.yml"
            dst_dir="~/homelab/docker/${service}"
            if [ -f "${src}" ]; then
              ${SSH} "mkdir -p ${dst_dir}"
              ${SCP} "${src}" "${DESKTOP_USER}@${DESKTOP_IP}:${dst_dir}/compose.yml"
              ${SSH} "docker compose -f ${dst_dir}/compose.yml up -d"
            fi
          done

      - name: Verify containers are healthy on Desktop
        env:
          DESKTOP_IP: 100.64.213.62
          DESKTOP_USER: vishnu
        run: |
          eval "$(ssh-agent -s)"
          echo "${{ secrets.DESKTOP_SSH_KEY }}" | ssh-add -

          unhealthy=$(ssh -o StrictHostKeyChecking=no ${DESKTOP_USER}@${DESKTOP_IP} \
            "docker ps --filter 'health=unhealthy' --format '{{.Names}}'")
          if [ -n "${unhealthy}" ]; then
            echo "Unhealthy containers: ${unhealthy}"
            exit 1
          fi
          echo "All containers healthy on Desktop"

      - name: Notify Slack (success)
        if: success()
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{
              "attachments": [{
                "color": "good",
                "text": "Desktop services deployed successfully from branch ${{ github.ref_name }} (commit ${{ github.sha }})."
              }]
            }' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Notify Slack (failure)
        if: failure()
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{
              "attachments": [{
                "color": "danger",
                "text": "Desktop services deployment failed on branch ${{ github.ref_name }} (commit ${{ github.sha }})."
              }]
            }' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
