name: Crypto Monitor

on:
  push:
    branches: [main]
    paths: [.github/workflows/crypto-monitor.yml]
  repository_dispatch:
    types: [crypto-monitor-deploy]
  workflow_dispatch:

env:
  DESKTOP_IP: 100.64.213.62
  DESKTOP_DOCKER: tcp://100.64.213.62:2375

jobs:
  test:
    name: Lint + Unit tests
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          repository: MuddyThunder1040/literate-octo-palm-tree
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt ruff

      - name: Lint
        working-directory: app
        run: ruff check .

      - name: Unit tests
        working-directory: app
        run: pytest tests/unit/ -v

  deploy-dev:
    name: Deploy → dev (Desktop WSL2)
    needs: test
    runs-on: [self-hosted, Linux, X64]
    environment: dev

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          repository: MuddyThunder1040/literate-octo-palm-tree
          path: app

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMELAB_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DESKTOP_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build image on Dell
        working-directory: app
        run: docker build -t crypto-monitor:dev .

      - name: Transfer image to Desktop
        run: |
          docker save crypto-monitor:dev \
            | ssh -i ~/.ssh/deploy_key vishnu@${{ env.DESKTOP_IP }} docker load

      - name: Deploy dev container on Desktop
        env:
          DOCKER_HOST: ${{ env.DESKTOP_DOCKER }}
        run: |
          docker ps -q --filter "publish=8001" | xargs -r docker rm -f
          docker rm -f crypto-monitor-dev 2>/dev/null || true
          docker run -d \
            --name crypto-monitor-dev \
            --restart unless-stopped \
            -p 8001:8000 \
            -e CASSANDRA_HOSTS=${{ env.DESKTOP_IP }} \
            -e CASSANDRA_KEYSPACE=crypto_market \
            -e CRYPTO_AUTO_INGEST_SECONDS=30 \
            crypto-monitor:dev

      - name: Wait for startup
        run: |
          for i in $(seq 1 20); do
            curl -sf http://${{ env.DESKTOP_IP }}:8001/api/cluster/health && exit 0
            sleep 3
          done
          echo "Dev did not become healthy" && exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  integration-test:
    name: Integration tests → dev
    needs: deploy-dev
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          repository: MuddyThunder1040/literate-octo-palm-tree
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt

      - name: Run integration tests
        working-directory: app
        env:
          APP_URL: http://${{ env.DESKTOP_IP }}:8001
        run: pytest tests/integration/ -v

  promote-prod:
    name: Promote → prod (Desktop WSL2)
    needs: integration-test
    runs-on: [self-hosted, Linux, X64]
    environment: prod

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMELAB_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DESKTOP_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Tag and transfer prod image
        run: |
          docker tag crypto-monitor:dev crypto-monitor:prod
          docker save crypto-monitor:prod \
            | ssh -i ~/.ssh/deploy_key vishnu@${{ env.DESKTOP_IP }} docker load

      - name: Deploy prod container on Desktop
        env:
          DOCKER_HOST: ${{ env.DESKTOP_DOCKER }}
        run: |
          docker ps -q --filter "publish=8000" | xargs -r docker rm -f
          docker rm -f crypto-monitor-prod 2>/dev/null || true
          docker run -d \
            --name crypto-monitor-prod \
            --restart unless-stopped \
            -p 8000:8000 \
            -e CASSANDRA_HOSTS=${{ env.DESKTOP_IP }} \
            -e CASSANDRA_KEYSPACE=crypto_market \
            -e CRYPTO_AUTO_INGEST_SECONDS=60 \
            crypto-monitor:prod

      - name: Smoke test prod
        run: |
          for i in $(seq 1 20); do
            curl -sf http://${{ env.DESKTOP_IP }}:8000/api/cluster/health && exit 0
            sleep 3
          done
          echo "Prod did not become healthy" && exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify Slack
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{
              "attachments": [{
                "color": "good",
                "text": "crypto-monitor promoted to prod on Desktop WSL2 (${{ github.sha }})."
              }]
            }' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
