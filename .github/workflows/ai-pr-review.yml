name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get PR Diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Placeholder Review
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "🤖 Auto Review Triggered\n\nAI review pipeline is running. Integrate OpenAI API for full review."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
